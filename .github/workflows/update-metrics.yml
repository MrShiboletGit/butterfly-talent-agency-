name: Update Social Media Metrics

on:
  # Triggered from admin panel "Reload Data" button
  repository_dispatch:
    types: [update-metrics]
  
  # Also run on a schedule (every Sunday at 3:00 AM UTC)
  schedule:
    - cron: '0 3 * * 0'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Run metrics validation
        run: |
          cd scripts
          python validate_metrics.py
        continue-on-error: true  # Don't fail if some APIs are unavailable
      
      - name: Update JSON files with new metrics
        run: |
          cd scripts
          python update_metrics.py
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet src/data/ scripts/validation_report.json || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/*.json scripts/validation_report.json
          git commit -m "🔄 Auto-update social media metrics [skip ci]"
          git push
      
      - name: Trigger Vercel rebuild
        if: steps.check_changes.outputs.changes == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Vercel rebuild triggered"
          else
            echo "VERCEL_DEPLOY_HOOK not set, skipping rebuild trigger"
          fi
